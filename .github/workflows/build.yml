name: Build container image
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 10 * * *'
  push:
    branches: [main]
    paths-ignore: ['**/README.md']
  workflow_dispatch:

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-dev:
    name: Build and Push Dev Image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Determine Dev Version and Tags
        id: meta
        run: |
          DATE=$(date +%y%m%d)
          TIMESTAMP=$(date +%H%M%S)
          # For dev, we use a '0.0.0-dev' prefix to distinguish from releases
          DEV_VERSION="0.0.0-dev.${DATE}.${TIMESTAMP}"
          TAG_LIST="dev dev.${DATE}.${TIMESTAMP}"
          
          echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          echo "build=${DATE}.${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "tags=${TAG_LIST}" >> $GITHUB_OUTPUT
          
          echo "SUMMARY_VERSION=${DEV_VERSION}" >> $GITHUB_ENV
          echo "SUMMARY_TAGS=${TAG_LIST}" >> $GITHUB_ENV

      - name: Build Image (Dev)
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OS_VERSION=${{ steps.meta.outputs.version }}
            OS_BUILD=${{ steps.meta.outputs.build }}
            OS_TYPE=dev
          oci: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Dev to GHCR
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: push
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generate Dev Build Summary
        if: always()
        run: |
          echo "## 🛠️ Dev Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **Internal Dev Version:** \`${{ env.SUMMARY_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Image Name:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "🏷️ **Tags Pushed:**" >> $GITHUB_STEP_SUMMARY
          for tag in ${{ env.SUMMARY_TAGS }}; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ *This is a development build and may be unstable.*" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed at $(date -u)" >> $GITHUB_STEP_SUMMARY

  sign-dev:
    name: Sign Dev Image
    runs-on: ubuntu-24.04
    needs: build-dev
    if: github.event_name != 'pull_request' && needs.build-dev.outputs.digest != ''
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign Dev Image
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-dev.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  release:
    name: Release Please
    runs-on: ubuntu-24.04
    needs: build-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  build-release:
    name: Build and Push Release Image
    runs-on: ubuntu-24.04
    needs: release
    if: |
      always() && 
      (needs.release.outputs.release_created == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Determine Version and Tags
        id: meta
        run: |
          DATE=$(date +%y%m%d)
          TIMESTAMP=$(date +%H%M%S)
          VERSION="${{ needs.release.outputs.tag_name }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          CLEAN_VERSION=$(echo $VERSION | sed 's/^v//')
          OS_VERSION_VAL="${CLEAN_VERSION}.${DATE}.${TIMESTAMP}"
          TAG_LIST="latest ${VERSION} latest.${DATE} latest.${DATE}.${TIMESTAMP}"
          echo "version=${OS_VERSION_VAL}" >> $GITHUB_OUTPUT
          echo "tags=${TAG_LIST}" >> $GITHUB_OUTPUT

      - name: Build Image (Latest)
        uses: redhat-actions/buildah-build@v2
        id: build
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OS_VERSION=${{ steps.meta.outputs.version }}
          oci: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release to GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
      
      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **Internal OS Version:** \`${{ env.SUMMARY_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Image Name:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "🏷️ **Tags Pushed:**" >> $GITHUB_STEP_SUMMARY
          for tag in ${{ env.SUMMARY_TAGS }}; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed at $(date -u)" >> $GITHUB_STEP_SUMMARY

  sign-release:
    name: Sign Release Image
    runs-on: ubuntu-24.04
    needs: build-release
    if: needs.build-release.outputs.digest != ''
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign Release Image
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-release.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
